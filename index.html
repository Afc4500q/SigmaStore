<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIGMA STORE</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-surface: #111827;
      --bg-card: #1e293b;
      --bg-img: #0f172a;
      
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #2563eb);
      --accent-glow: rgba(56, 189, 248, 0.2);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --badge-brand-bg: rgba(56, 189, 248, 0.12);
      --badge-brand-text: #38bdf8;
      --badge-model-bg: rgba(148, 163, 184, 0.1);
      --badge-model-text: #cbd5e1;
      
      --price-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.07);
      --border-focus: rgba(56, 189, 248, 0.4);
      --card-radius: 16px;
      --danger: #f43f5e;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* الهيدر */
    header {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* الشعار كصورة */
      /* الشعار يظهر كاملاً بدون أي قص */
    .brand-logo-img {
      height: 38px;
      width: auto;
      max-width: 110px;
      object-fit: contain;
      display: block;
    }


    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .cart-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 7px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .cart-btn:active {
      transform: scale(0.96);
    }

    .cart-badge {
      background: var(--accent-gradient);
      color: #0b0f19;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
    }

    /* شريط الأقسام */
    .categories-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: #fff;
      color: #0b0f19;
      border-color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
    }

    /* شبكة المنتجات */
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 18px;
      }
    }

    /* بطاقة المنتج */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .card-img-wrapper {
      width: 100%;
      height: 160px;
      background: var(--bg-img);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .card-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 10px;
    }

    /* الاسم في الأعلى بشكل بارز وواضح */
    .card-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
      word-break: break-word;
      margin-bottom: 6px;
    }

    /* الماركة والموديل بالأسفل */
    .card-meta-box {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .meta-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      line-height: 1.2;
    }

    .meta-brand {
      background: var(--badge-brand-bg);
      color: var(--badge-brand-text);
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .meta-model {
      background: var(--badge-model-bg);
      color: var(--badge-model-text);
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: auto;
    }

    .price-val {
      color: var(--price-color);
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    .add-action-btn {
      width: 32px;
      height: 32px;
      background: var(--accent-gradient);
      border: none;
      color: #0b0f19;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .add-action-btn:active {
      transform: scale(0.9);
    }

    /* النوافذ المنبثقة */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
      gap: 8px;
    }

    .item-info { flex: 1; }
    .item-name { font-size: 13px; font-weight: 600; color: #fff; }
    .item-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .item-price { font-size: 12px; color: var(--accent); margin-top: 3px; font-weight: 700; }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .qty-display { font-size: 13px; font-weight: bold; min-width: 18px; text-align: center; }
    .del-item-btn { background: none; border: none; color: var(--danger); font-size: 16px; cursor: pointer; padding: 4px; }

    .cart-summary {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      margin: 16px 0 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .btn-main {
      width: 100%;
      background: var(--accent-gradient);
      color: #0b0f19;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .delivery-notice {
      background: rgba(56, 189, 248, 0.08);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      color: #e0f2fe;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- الهيدر مع صورة الشعار -->
  <header>
    <div class="brand">
      <img src="img/IMG_4544.jpeg" alt="SIGMA" class="brand-logo-img" onerror="this.src='img/simag.jpg'; this.onerror=null;">
      <div class="brand-title">SIGMA STORE</div>
    </div>
    <button class="cart-btn" onclick="openCartModal()">
      <span>🛒 السلة</span>
      <span class="cart-badge" id="cartCountBadge">0</span>
    </button>
  </header>

  <!-- شريط الأقسام -->
  <div class="categories-bar" id="categoriesBar">
    <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
    <button class="cat-btn" onclick="filterCategory('الكترونيات', this)">الكترونيات</button>
    <button class="cat-btn" onclick="filterCategory('الكيبلات', this)">الكيبلات</button>
    <button class="cat-btn" onclick="filterCategory('الهتفونات', this)">الهتفونات</button>
    <button class="cat-btn" onclick="filterCategory('الايربود', this)">الايربود</button>
    <button class="cat-btn" onclick="filterCategory('سماعات الراس', this)">سماعات الراس</button>
    <button class="cat-btn" onclick="filterCategory('الشواحن', this)">الشواحن</button>
    <button class="cat-btn" onclick="filterCategory('الموزعات', this)">الموزعات</button>
  </div>

  <!-- شبكة المنتجات -->
  <div class="container">
    <div class="grid" id="productsGrid">
      <p style="text-align:center; grid-column: 1/-1; color: var(--text-dim); padding: 30px 0;">جاري تحميل المنتجات...</p>
    </div>
  </div>

  <!-- نافذة السلة -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 16px;">سلة المشتريات</h3>
        <button class="close-btn" onclick="closeCartModal()">✕</button>
      </div>
      <div id="cartItemsContainer"></div>
      <div id="cartFooterSection" style="display: none;">
        <div class="cart-summary">
          <span>المجموع الإجمالي:</span>
          <span id="cartTotalPrice" style="color: var(--accent);">0 د.ع</span>
        </div>
        <button class="btn-main" onclick="openCheckoutModal()">متابعة إتمام الطلب 💳</button>
        <button class="btn-clear" onclick="clearFullCart()">إفراغ السلة كلياً</button>
      </div>
    </div>
  </div>

  <!-- نافذة التوصيل -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 16px;">بيانات التوصيل</h3>
        <button class="close-btn" onclick="closeCheckoutModal()">✕</button>
      </div>
      <div class="delivery-notice">
        📍 <strong>تنبيه التوصيل:</strong>التوصيل مجانا في مدينة الناصرية ما عداالمناطق خلف الجسر الهولندي</div>
      <form id="orderForm">
        <div class="form-group">
          <label>رقم الموبايل *</label>
          <input type="tel" id="custPhone" required placeholder="07XXXXXXXXX">
        </div>
        <div class="form-group">
          <label>العنوان بالتفصيل *</label>
          <input type="text" id="custAddress" required placeholder="المنطقة - الشارع - أقرب نقطة دالة">
        </div>
        <button type="submit" class="btn-main" id="confirmOrderBtn" style="margin-top: 8px;">
          تأكيد وإرسال الطلب
        </button>
      </form>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://lucky-dream-49fc.afc4500q.workers.dev";
    let products = [];
    let currentCategory = "الكل";
    let cart = [];

    const savedCart = localStorage.getItem("sigma_cart");
    if (savedCart) {
      try { cart = JSON.parse(savedCart); } catch(e) { cart = []; }
    }

    async function loadProducts() {
      try {
        const response = await fetch("products.json?t=" + Date.now());
        if (!response.ok) throw new Error("تعذر جلب البيانات");
        products = await response.json();
        renderProducts();
        updateCartBadge();
      } catch (err) {
        document.getElementById("productsGrid").innerHTML = 
          '<p style="text-align:center; grid-column:1/-1; color:var(--text-dim); padding:30px 0;">لا توجد منتجات مسجلة حالياً</p>';
      }
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      
      const filtered = currentCategory === "الكل" 
        ? products 
        : products.filter(p => p.category === currentCategory);

      if (!filtered || filtered.length === 0) {
        grid.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:var(--text-dim); padding:30px 0;">لا توجد منتجات في قسم (${currentCategory})</p>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const brandDisplay = (p.brand && p.brand !== "-") ? `<span class="meta-tag meta-brand">الماركة: ${p.brand}</span>` : '';
        const modelDisplay = (p.model && p.model !== "-") ? `<span class="meta-tag meta-model">الموديل: ${p.model}</span>` : '';

        return `
          <div class="card">
            <div class="card-img-wrapper">
              <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x200?text=SIGMA'">
            </div>
            <div class="card-content">
              <div>
                <!-- الاسم في الأعلى وبارز -->
                <div class="card-title">${p.name}</div>
                <!-- الماركة والموديل تحته -->
                <div class="card-meta-box">
                  ${brandDisplay}
                  ${modelDisplay}
                </div>
              </div>
              <div class="card-bottom">
                <span class="price-val">${p.price.toLocaleString()} د.ع</span>
                <button class="add-action-btn" title="إضافة للسلة" onclick="addToCart(${p.id})">+</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function addToCart(productId) {
      const item = products.find(p => p.id === productId);
      if (!item) return;
      const existing = cart.find(c => c.id === productId);
      if (existing) existing.qty += 1;
      else cart.push({ ...item, qty: 1 });
      saveAndSyncCart();
    }

    function increaseQty(productId) {
      const item = cart.find(c => c.id === productId);
      if (item) { item.qty += 1; saveAndSyncCart(); }
    }

    function decreaseQty(productId) {
      const index = cart.findIndex(c => c.id === productId);
      if (index !== -1) {
        if (cart[index].qty > 1) cart[index].qty -= 1;
        else cart.splice(index, 1);
        saveAndSyncCart();
      }
    }

    function removeFromCart(productId) {
      cart = cart.filter(c => c.id !== productId);
      saveAndSyncCart();
    }

    function clearFullCart() {
      if (confirm("هل تريد إفراغ سلة المشتريات بالكامل؟")) {
        cart = [];
        saveAndSyncCart();
      }
    }

    function saveAndSyncCart() {
      localStorage.setItem("sigma_cart", JSON.stringify(cart));
      updateCartBadge();
      renderCartItems();
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cartCountBadge").innerText = totalCount;
    }

    function renderCartItems() {
      const container = document.getElementById("cartItemsContainer");
      const footer = document.getElementById("cartFooterSection");

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:20px 0;">السلة فارغة حالياً</p>';
        footer.style.display = "none";
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-sub">${item.brand || ''} ${item.model || ''}</div>
            <div class="item-price">${(item.price * item.qty).toLocaleString()} د.ع</div>
          </div>
          <div class="item-controls">
            <button class="qty-btn" onclick="decreaseQty(${item.id})">-</button>
            <span class="qty-display">${item.qty}</span>
            <button class="qty-btn" onclick="increaseQty(${item.id})">+</button>
            <button class="del-item-btn" onclick="removeFromCart(${item.id})">🗑️</button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById("cartTotalPrice").innerText = total.toLocaleString() + " د.ع";
      footer.style.display = "block";
    }

    function openCartModal() {
      renderCartItems();
      document.getElementById("cartModal").style.display = "flex";
    }

    function closeCartModal() {
      document.getElementById("cartModal").style.display = "none";
    }

    function openCheckoutModal() {
      closeCartModal();
      document.getElementById("checkoutModal").style.display = "flex";
    }

    function closeCheckoutModal() {
      document.getElementById("checkoutModal").style.display = "none";
    }

    document.getElementById("orderForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const sendBtn = document.getElementById("confirmOrderBtn");
      sendBtn.disabled = true;
      sendBtn.innerText = "جاري الإرسال...";

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const productsListText = cart.map(item => `- ${item.name} [${item.brand || ''} ${item.model || ''}] (الكمية: ${item.qty})`).join("\n");
      const orderNumber = Math.floor(1000 + Math.random() * 9000);
      const currentDate = new Date().toLocaleString("ar-IQ", { timeZone: "Asia/Baghdad" });

      const payload = {
        orderNumber: orderNumber,
        phone: document.getElementById("custPhone").value.trim(),
        address: document.getElementById("custAddress").value.trim(),
        products: productsListText,
        total: total.toLocaleString() + " د.ع",
        date: currentDate
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok && data.ok) {
          alert(`تم تأكيد طلبك بنجاح! 🎉\nرقم الطلب: #${orderNumber}\nسيتم التواصل معك هاتفياً للتوصيل.`);
          cart = [];
          saveAndSyncCart();
          closeCheckoutModal();
          document.getElementById("orderForm").reset();
        } else {
          alert("حدث خطأ: " + (data.error || "تعذر إرسال الطلب"));
        }
      } catch (err) {
        alert("حدث خطأ أثناء الاتصال بالخادم.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "تأكيد وإرسال الطلب";
      }
    });

    loadProducts();
  </script>
</body>
</html>
