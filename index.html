<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIGMA STORE</title>
  <style>
    :root {
      --bg-main: #0c0a06;
      --bg-surface: #17140e;
      --bg-card: #1c1710;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #fbfbfb;
      --text-dim: #a8a29e;
      --border-color: rgba(245, 158, 11, 0.18);
      --card-radius: 12px;
      --danger: #ef4444;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* شريط الرأس */
    header {
      width: 100%;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(23, 20, 14, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent), #b45309);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0c0a06;
      font-size: 18px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .cart-btn {
      background: var(--bg-surface);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cart-badge {
      background: var(--accent);
      color: #0c0a06;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
    }

    /* شريط الأقسام (Categories Bar) */
    .categories-bar {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none; /* إخفاء شريط التمرير */
      background: rgba(17, 20, 14, 0.6);
      border-bottom: 1px solid var(--border-color);
    }
    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent);
      color: #0c0a06;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* الحاوية والشبكة */
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
    }

    /* بطاقة المنتج */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-img-wrapper {
      width: 100%;
      height: 130px;
      background: #120e08;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    /* الماركة والموديل */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .brand-tag {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .model-tag {
      color: var(--text-dim);
      font-size: 11px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
      word-break: break-word;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .price {
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
    }

    .add-action-btn {
      width: 28px;
      height: 28px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    /* النوافذ المنبثقة */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 20px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
      gap: 6px;
    }

    .item-info { flex: 1; }
    .item-name { font-size: 12px; font-weight: 600; }
    .item-sub { font-size: 10px; color: var(--text-dim); }
    .item-price { font-size: 11px; color: var(--accent); margin-top: 2px; }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      background: #262117;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .qty-display { font-size: 12px; font-weight: bold; min-width: 16px; text-align: center; }
    .del-item-btn { background: none; border: none; color: var(--danger); font-size: 15px; cursor: pointer; }

    .cart-summary {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      color: var(--accent);
      margin: 12px 0;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #0c0a06;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 7px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
    }

    .delivery-notice {
      background: rgba(245, 158, 11, 0.1);
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 9px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <div class="brand">
      <div class="brand-logo">S</div>
      <div class="brand-title">SIGMA STORE</div>
    </div>
    <button class="cart-btn" onclick="openCartModal()">
      <span>🛒 السلة</span>
      <span class="cart-badge" id="cartCountBadge">0</span>
    </button>
  </header>

  <!-- شريط الأقسام السريع -->
  <div class="categories-bar" id="categoriesBar">
    <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
    <button class="cat-btn" onclick="filterCategory('الكيبلات', this)">الكيبلات</button>
    <button class="cat-btn" onclick="filterCategory('الهتفونات', this)">الهتفونات</button>
    <button class="cat-btn" onclick="filterCategory('الايربود', this)">الايربود</button>
    <button class="cat-btn" onclick="filterCategory('سماعات الراس', this)">سماعات الراس</button>
    <button class="cat-btn" onclick="filterCategory('الشواحن', this)">الشواحن</button>
    <button class="cat-btn" onclick="filterCategory('الموزعات', this)">الموزعات</button>
  </div>

  <!-- شبكة المنتجات -->
  <div class="container">
    <div class="grid" id="productsGrid">
      <p style="text-align:center; grid-column: 1/-1; color: var(--text-dim);">جاري تحميل المنتجات...</p>
    </div>
  </div>

  <!-- نافذة السلة -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>سلة المشتريات</h3>
        <button class="close-btn" onclick="closeCartModal()">✕</button>
      </div>
      <div id="cartItemsContainer"></div>
      <div id="cartFooterSection" style="display: none;">
        <div class="cart-summary">
          <span>المجموع:</span>
          <span id="cartTotalPrice">0 د.ع</span>
        </div>
        <button class="btn-main" onclick="openCheckoutModal()">متابعة الشراء 💳</button>
        <button class="btn-clear" onclick="clearFullCart()">إفراغ السلة</button>
      </div>
    </div>
  </div>

  <!-- نافذة التوصيل -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>بيانات التوصيل</h3>
        <button class="close-btn" onclick="closeCheckoutModal()">✕</button>
      </div>
      <div class="delivery-notice">
        📍 <strong>ملاحظة:</strong> التوصيل داخل مدينة الناصرية وناحية سيديناوية فقط.
      </div>
      <form id="orderForm">
        <div class="form-group">
          <label>رقم الموبايل *</label>
          <input type="tel" id="custPhone" required placeholder="07XXXXXXXXX">
        </div>
        <div class="form-group">
          <label>العنوان بالتفصيل *</label>
          <input type="text" id="custAddress" required placeholder="المنطقة - الشارع - أقرب نقطة دالة">
        </div>
        <button type="submit" class="btn-main" id="confirmOrderBtn" style="margin-top: 6px;">
          تأكيد وإرسال الطلب
        </button>
      </form>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://lucky-dream-49fc.afc4500q.workers.dev";
    let products = [];
    let currentCategory = "الكل";
    let cart = [];

    const savedCart = localStorage.getItem("sigma_cart");
    if (savedCart) {
      try { cart = JSON.parse(savedCart); } catch(e) { cart = []; }
    }

    async function loadProducts() {
      try {
        const response = await fetch("products.json?t=" + Date.now());
        if (!response.ok) throw new Error("تعذر جلب البيانات");
        products = await response.json();
        renderProducts();
        updateCartBadge();
      } catch (err) {
        document.getElementById("productsGrid").innerHTML = 
          '<p style="text-align:center; grid-column:1/-1; color:var(--text-dim);">لا توجد منتجات مسجلة حالياً</p>';
      }
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      
      const filtered = currentCategory === "الكل" 
        ? products 
        : products.filter(p => p.category === currentCategory);

      if (!filtered || filtered.length === 0) {
        grid.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:var(--text-dim); padding:20px 0;">لا توجد منتجات في قسم (${currentCategory})</p>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="card">
          <div class="card-img-wrapper">
            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x200?text=SIGMA'">
          </div>
          <div class="card-content">
            <div>
              <div class="card-meta">
                <span class="brand-tag">${p.brand || 'عام'}</span>
                <span class="model-tag">${p.model || ''}</span>
              </div>
              <div class="card-title">${p.name}</div>
            </div>
            <div class="card-bottom">
              <span class="price">${p.price.toLocaleString()} د.ع</span>
              <button class="add-action-btn" title="إضافة" onclick="addToCart(${p.id})">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const item = products.find(p => p.id === productId);
      if (!item) return;
      const existing = cart.find(c => c.id === productId);
      if (existing) existing.qty += 1;
      else cart.push({ ...item, qty: 1 });
      saveAndSyncCart();
    }

    function increaseQty(productId) {
      const item = cart.find(c => c.id === productId);
      if (item) { item.qty += 1; saveAndSyncCart(); }
    }

    function decreaseQty(productId) {
      const index = cart.findIndex(c => c.id === productId);
      if (index !== -1) {
        if (cart[index].qty > 1) cart[index].qty -= 1;
        else cart.splice(index, 1);
        saveAndSyncCart();
      }
    }

    function removeFromCart(productId) {
      cart = cart.filter(c => c.id !== productId);
      saveAndSyncCart();
    }

    function clearFullCart() {
      if (confirm("هل تريد إفراغ سلة المشتريات بالكامل؟")) {
        cart = [];
        saveAndSyncCart();
      }
    }

    function saveAndSyncCart() {
      localStorage.setItem("sigma_cart", JSON.stringify(cart));
      updateCartBadge();
      renderCartItems();
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cartCountBadge").innerText = totalCount;
    }

    function renderCartItems() {
      const container = document.getElementById("cartItemsContainer");
      const footer = document.getElementById("cartFooterSection");

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:16px 0;">السلة فارغة حالياً</p>';
        footer.style.display = "none";
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-sub">${item.brand || ''} ${item.model || ''}</div>
            <div class="item-price">${(item.price * item.qty).toLocaleString()} د.ع</div>
          </div>
          <div class="item-controls">
            <button class="qty-btn" onclick="decreaseQty(${item.id})">-</button>
            <span class="qty-display">${item.qty}</span>
            <button class="qty-btn" onclick="increaseQty(${item.id})">+</button>
            <button class="del-item-btn" onclick="removeFromCart(${item.id})">🗑️</button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById("cartTotalPrice").innerText = total.toLocaleString() + " د.ع";
      footer.style.display = "block";
    }

    function openCartModal() {
      renderCartItems();
      document.getElementById("cartModal").style.display = "flex";
    }

    function closeCartModal() {
      document.getElementById("cartModal").style.display = "none";
    }

    function openCheckoutModal() {
      closeCartModal();
      document.getElementById("checkoutModal").style.display = "flex";
    }

    function closeCheckoutModal() {
      document.getElementById("checkoutModal").style.display = "none";
    }

    document.getElementById("orderForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const sendBtn = document.getElementById("confirmOrderBtn");
      sendBtn.disabled = true;
      sendBtn.innerText = "جاري الإرسال...";

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const productsListText = cart.map(item => `- ${item.name} [${item.brand || ''} ${item.model || ''}] (الكمية: ${item.qty})`).join("\n");
      const orderNumber = Math.floor(1000 + Math.random() * 9000);
      const currentDate = new Date().toLocaleString("ar-IQ", { timeZone: "Asia/Baghdad" });

      const payload = {
        orderNumber: orderNumber,
        phone: document.getElementById("custPhone").value.trim(),
        address: document.getElementById("custAddress").value.trim(),
        products: productsListText,
        total: total.toLocaleString() + " د.ع",
        date: currentDate
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok && data.ok) {
          alert(`تم تأكيد طلبك بنجاح! 🎉\nرقم الطلب: #${orderNumber}\nسيتم التواصل معك هاتفياً للتوصيل.`);
          cart = [];
          saveAndSyncCart();
          closeCheckoutModal();
          document.getElementById("orderForm").reset();
        } else {
          alert("حدث خطأ: " + (data.error || "تعذر إرسال الطلب"));
        }
      } catch (err) {
        alert("حدث خطأ أثناء الاتصال بالخادم.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "تأكيد وإرسال الطلب";
      }
    });

    loadProducts();
  </script>
</body>
</html>
