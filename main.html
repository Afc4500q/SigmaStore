<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGMA STORE</title>
  <style>
    :root {
      --bg-main: #0c0a06;
      --bg-surface: #17140e;
      --bg-card: rgba(26, 21, 14, 0.9);
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #fbfbfb;
      --text-dim: #a8a29e;
      --border-color: rgba(245, 158, 11, 0.15);
      --card-radius: 14px;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 60px;
    }

    /* شريط الرأس */
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(23, 20, 14, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent), #b45309);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0c0a06;
      font-size: 20px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent);
    }

    .cart-btn {
      background: var(--bg-surface);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
      transition: all 0.2s;
    }

    .cart-btn:hover {
      background: var(--accent);
      color: #0c0a06;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .cart-badge {
      background: var(--accent);
      color: #0c0a06;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
    }

    .cart-btn:hover .cart-badge {
      background: #0c0a06;
      color: var(--accent);
    }

    /* قسم العنوان */
    .hero {
      text-align: center;
      padding: 24px 16px 10px;
    }

    .hero h2 {
      font-size: 22px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .hero p {
      color: var(--text-dim);
      font-size: 13px;
    }

    /* شبكة المنتجات */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
    }

    /* بطاقة المنتج */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 150px;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .card:hover .card-img-wrapper img {
      transform: scale(1.05);
    }

    .card-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .price {
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
    }

    .add-action-btn {
      width: 32px;
      height: 32px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .add-action-btn:hover {
      background: var(--accent);
      color: #0c0a06;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* النوافذ المنبثقة (Modals) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 20px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
      gap: 10px;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .item-price {
      font-size: 12px;
      color: var(--accent);
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      background: #262117;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    .qty-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .qty-display {
      font-size: 13px;
      font-weight: bold;
      min-width: 18px;
      text-align: center;
    }

    .del-item-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 16px;
      margin-right: 4px;
    }

    .cart-footer {
      margin-top: 16px;
    }

    .cart-summary {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 14px;
      padding: 8px 0;
      border-top: 1px solid var(--border-color);
    }

    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #0c0a06;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-main:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-clear:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* تنبيه التوصيل */
    .delivery-notice {
      background: rgba(245, 158, 11, 0.1);
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1.4;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <div class="brand">
      <div class="brand-logo">S</div>
      <div class="brand-title">SIGMA STORE</div>
    </div>
    <button class="cart-btn" onclick="openCartModal()">
      <span>🛒 السلة</span>
      <span class="cart-badge" id="cartCountBadge">0</span>
    </button>
  </header>

  <div class="hero">
    <h2>المتجر الإلكتروني لقطع الغيار والصيانة</h2>
    <p>اختر ما تحتاجه وسيصلك الطلب مباشرة</p>
  </div>

  <!-- شبكة المنتجات -->
  <div class="container">
    <div class="grid" id="productsGrid">
      <p style="text-align:center; grid-column: 1/-1; color: var(--text-dim);">جاري تحميل المنتجات...</p>
    </div>
  </div>

  <!-- نافذة السلة (Modal) -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>سلة المشتريات</h3>
        <button class="close-btn" onclick="closeCartModal()">✕</button>
      </div>

      <div id="cartItemsContainer"></div>

      <div id="cartFooterSection" class="cart-footer" style="display: none;">
        <div class="cart-summary">
          <span>المجموع الإجمالي:</span>
          <span id="cartTotalPrice">0 د.ع</span>
        </div>
        <button class="btn-main" onclick="openCheckoutModal()">متابعة إتمام الشراء 💳</button>
        <button class="btn-clear" onclick="clearFullCart()">إفراغ السلة كلياً</button>
      </div>
    </div>
  </div>

  <!-- نافذة التوصيل وإتمام الشراء (Modal) -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>بيانات التوصيل</h3>
        <button class="close-btn" onclick="closeCheckoutModal()">✕</button>
      </div>

      <div class="delivery-notice">
        📍 <strong>ملاحظة التوصيل:</strong> التوصيل داخل مدينة الناصرية وناحية سيديناوية فقط.
      </div>

      <form id="orderForm">
        <div class="form-group">
          <label>رقم الموبايل (متاح عليه واتساب / اتصال) *</label>
          <input type="tel" id="custPhone" required placeholder="07XXXXXXXXX">
        </div>
        <div class="form-group">
          <label>العنوان بالتفصيل *</label>
          <input type="text" id="custAddress" required placeholder="المنطقة - الشارع - أقرب نقطة دالة">
        </div>
        <button type="submit" class="btn-main" id="confirmOrderBtn" style="margin-top: 10px;">
          تأكيد وإرسال الطلب
        </button>
      </form>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://lucky-dream-49fc.afc4500q.workers.dev";

    let products = [];
    let cart = [];

    // استرجاع السلة المحفوظة محلياً
    const savedCart = localStorage.getItem("sigma_cart");
    if (savedCart) {
      try { cart = JSON.parse(savedCart); } catch(e) { cart = []; }
    }

    // جلب المنتجات من products.json مع منع الـ Cache لضمان التحديث الفوري
    async function loadProducts() {
      try {
        const response = await fetch("products.json?t=" + Date.now());
        if (!response.ok) throw new Error("تعذر جلب البيانات");
        products = await response.json();
        renderProducts();
        updateCartBadge();
      } catch (err) {
        document.getElementById("productsGrid").innerHTML = 
          '<p style="text-align:center; grid-column:1/-1; color:var(--text-dim);">لا توجد منتجات مسجلة حالياً</p>';
      }
    }

    // عرض المنتجات في الشبكة
    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      if (!products || products.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-dim);">لا توجد منتجات مسجلة حالياً</p>';
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="card">
          <div class="card-img-wrapper">
            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x200?text=SIGMA'">
          </div>
          <div class="card-content">
            <div class="card-title">${p.name}</div>
            <div class="card-bottom">
              <span class="price">${p.price.toLocaleString()} د.ع</span>
              <button class="add-action-btn" title="إضافة للسلة" onclick="addToCart(${p.id})">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // إضافة منتج للسلة
    function addToCart(productId) {
      const item = products.find(p => p.id === productId);
      if (!item) return;

      const existing = cart.find(c => c.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      saveAndSyncCart();
    }

    // زيادة الكمية (+1)
    function increaseQty(productId) {
      const item = cart.find(c => c.id === productId);
      if (item) {
        item.qty += 1;
        saveAndSyncCart();
      }
    }

    // تقليل الكمية (-1) - حذف جزئي
    function decreaseQty(productId) {
      const index = cart.findIndex(c => c.id === productId);
      if (index !== -1) {
        if (cart[index].qty > 1) {
          cart[index].qty -= 1;
        } else {
          cart.splice(index, 1);
        }
        saveAndSyncCart();
      }
    }

    // حذف منتج بالكامل
    function removeFromCart(productId) {
      cart = cart.filter(c => c.id !== productId);
      saveAndSyncCart();
    }

    // تفريغ السلة كلياً
    function clearFullCart() {
      if (confirm("هل تريد إفراغ سلة المشتريات بالكامل؟")) {
        cart = [];
        saveAndSyncCart();
      }
    }

    // مزامنة السلة وحفظها في المتصفح
    function saveAndSyncCart() {
      localStorage.setItem("sigma_cart", JSON.stringify(cart));
      updateCartBadge();
      renderCartItems();
    }

    // تحديث رقم العداد بالهيدر
    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cartCountBadge").innerText = totalCount;
    }

    // عرض عناصر السلة في النافذة
    function renderCartItems() {
      const container = document.getElementById("cartItemsContainer");
      const footer = document.getElementById("cartFooterSection");

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:20px 0;">السلة فارغة حالياً</p>';
        footer.style.display = "none";
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-price">${(item.price * item.qty).toLocaleString()} د.ع</div>
          </div>
          <div class="item-controls">
            <button class="qty-btn" onclick="decreaseQty(${item.id})">-</button>
            <span class="qty-display">${item.qty}</span>
            <button class="qty-btn" onclick="increaseQty(${item.id})">+</button>
            <button class="del-item-btn" title="حذف" onclick="removeFromCart(${item.id})">🗑️</button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById("cartTotalPrice").innerText = total.toLocaleString() + " د.ع";
      footer.style.display = "block";
    }

    // إدارة النوافذ
    function openCartModal() {
      renderCartItems();
      document.getElementById("cartModal").style.display = "flex";
    }

    function closeCartModal() {
      document.getElementById("cartModal").style.display = "none";
    }

    function openCheckoutModal() {
      closeCartModal();
      document.getElementById("checkoutModal").style.display = "flex";
    }

    function closeCheckoutModal() {
      document.getElementById("checkoutModal").style.display = "none";
    }

    // إرسال الطلب الفعلي للسيرفر ومن ثم للتيليجرام
    document.getElementById("orderForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const sendBtn = document.getElementById("confirmOrderBtn");
      sendBtn.disabled = true;
      sendBtn.innerText = "جاري إرسال الطلب...";

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const productsListText = cart.map(item => `- ${item.name} (الكمية: ${item.qty})`).join("\n");
      const orderNumber = Math.floor(1000 + Math.random() * 9000);
      const currentDate = new Date().toLocaleString("ar-IQ", { timeZone: "Asia/Baghdad" });

      const payload = {
        orderNumber: orderNumber,
        phone: document.getElementById("custPhone").value.trim(),
        address: document.getElementById("custAddress").value.trim(),
        products: productsListText,
        total: total.toLocaleString() + " د.ع",
        date: currentDate
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok && data.ok) {
          alert(`تم تأكيد طلبك بنجاح! 🎉\nرقم الطلب: #${orderNumber}\nسيتم التواصل معك هاتفياً للتوصيل.`);
          cart = [];
          saveAndSyncCart();
          closeCheckoutModal();
          document.getElementById("orderForm").reset();
        } else {
          alert("حدث خطأ: " + (data.error || "تعذر إرسال الطلب"));
        }
      } catch (err) {
        alert("حدث خطأ في الاتصال بالخادم، يرجى المحاولة لاحقاً.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "تأكيد وإرسال الطلب";
      }
    });

    // تشغيل الجلب التلقائي عند التحميل
    loadProducts();
  </script>
</body>
</html>
